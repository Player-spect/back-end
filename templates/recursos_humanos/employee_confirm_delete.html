{% extends 'base.html' %}

{% block title %}Eliminar empleado{% endblock %}
{% block header %}Eliminar empleado{% endblock %}

{% block content %}
<div class="alert alert-danger">
    ¿Seguro que deseas eliminar al empleado <strong>{{ employee.name }}</strong> ({{ employee.rut }})?
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'employee_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
