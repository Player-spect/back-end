{% extends 'base.html' %}

{% block title %}Eliminar usuario{% endblock %}
{% block header %}Eliminar usuario{% endblock %}

{% block content %}
<div class="alert alert-danger">
    ¿Seguro que deseas eliminar al usuario <strong>{{ user_obj.username }}</strong>? Esta acción no se puede deshacer.
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
