{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">{{ datos.nombre_tienda }}</h2>
<p class="text-muted">{{ datos.slogan }}</p>

<div class="row">
    {% for producto in datos.productos %}
    <div class="col-md-6 col-lg-3 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ producto.nombre }}</h5>
                <p class="card-text text-success fw-bold">${{ producto.precio }}</p>
                <span class="badge bg-secondary">Stock: {{ producto.stock }}</span>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
