{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
    <div>
        <h2 class="mb-0 text-primary fw-bold">{{ datos.nombre_tienda }}</h2>
        <p class="text-muted mb-0">{{ datos.slogan }}</p>
    </div>
</div>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
    {% for producto in datos.productos %}
    <div class="col">
        <div class="card h-100 shadow-sm border-0 bg-white">
            <div class="card-body d-flex flex-column text-center">
                <h5 class="card-title text-dark fw-semibold mb-3">{{ producto.nombre }}</h5>
                <p class="card-text text-success fs-3 fw-bold mb-auto">${{ producto.precio }}</p>
            </div>
            <div class="card-footer bg-transparent border-top-0 pb-3 pt-0">
                <span class="badge rounded-pill bg-secondary w-100 py-2 fs-6">Stock: {{ producto.stock }}</span>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
